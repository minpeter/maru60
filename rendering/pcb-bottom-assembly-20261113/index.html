</style><p><strong>역실장 LED 배치 · 겸용 배열 유지</strong></p>
<div class="notice">배치 검토용 KiCad 렌더입니다. 재배선·검증이 진행 중이며 주문용 완성본이 아닙니다.</div>
<div class="stats"><span>상면 SMT 부품 <strong>0</strong></span><span>키 LED <strong>64</strong></span><span>기판 창 <strong>66</strong></span></div>
<div class="controls"><button aria-pressed="true" onclick="side('top',this)">스위치 면</button><button aria-pressed="false" onclick="side('bottom',this)">실장 면</button><label>확대 <input type="range" min="100" max="250" value="100" oninput="document.getElementById('board').style.width=this.value+'%'"></label></div>
<div class="viewport"><img id="board" src="/home/minpeter/github.com/minpeter/maru60/rendering/pcb-bottom-assembly-20261113/pcb-top-crop.png" alt="역실장 LED 창이 추가된 실제 PCB 상면"></div>
<div class="details"><figure><img src="/home/minpeter/github.com/minpeter/maru60/rendering/pcb-bottom-assembly-20261113/caps-detail.png"><figcaption><strong>Caps Lock</strong><br>일반·스텝드 소켓과 구멍을 보존하고 LED 창을 주변으로 이동했습니다.</figcaption></figure><figure><img src="/home/minpeter/github.com/minpeter/maru60/rendering/pcb-bottom-assembly-20261113/shift-detail.png"><figcaption><strong>오른쪽 Shift</strong><br>2.75U / 1.75U+1U 겸용을 유지합니다. 일부 LED는 스위치 창과 어긋납니다.</figcaption></figure></div>
<p class="foot">부품 몸체가 생략된 베어 PCB 렌더입니다. 실제 LED 높이·조명 분포·조립 공차의 검증을 대신하지 않습니다. Backspace의 LED14·15는 각각 두 위치 중 하나만 실장하므로 창 66개에 LED 64개가 장착됩니다.</p>
<script>const paths={top:"/home/minpeter/github.com/minpeter/maru60/rendering/pcb-bottom-assembly-20261113/pcb-top-crop.png",bottom:"/home/minpeter/github.com/minpeter/maru60/rendering/pcb-bottom-assembly-20261113/pcb-bottom-crop.png"};function side(s,b){document.getElementById('board').src=paths[s];document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));}</script></html>
