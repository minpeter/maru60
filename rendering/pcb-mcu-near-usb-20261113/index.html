<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans)}
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 12px}.name{font-size:15px;font-weight:650}.tabs{display:flex;gap:5px}button{border:1px solid var(--border);background:var(--secondary);color:var(--foreground);border-radius:var(--radius);padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.canvas{background:var(--card);border-radius:var(--radius);padding:16px;aspect-ratio:2.4;display:flex;align-items:center;justify-content:center;overflow:hidden}.canvas img{display:block;width:100%;height:100%;object-fit:contain}.canvas img[hidden]{display:none}
.caption{font-size:12px;color:var(--muted-foreground);margin:10px 0 18px;line-height:1.6}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px}.details figure{margin:0}.detail-image{padding:16px;background:var(--card);border-radius:var(--radius);aspect-ratio:1.4;display:flex;align-items:center;justify-content:center}.detail-image img{width:100%;height:100%;object-fit:contain}.details figcaption{font-size:12px;line-height:1.5;color:var(--muted-foreground);margin:7px 0 0}.details strong{display:block;font-size:13px;color:var(--foreground);font-weight:600;margin-bottom:3px}
@media(max-width:430px){.canvas{aspect-ratio:2}.details{grid-template-columns:1fr}.detail-image{aspect-ratio:1.7}button{padding:7px 10px}}
</style></head><body>
<div class="controls"><span class="name">최종 PCB</span><div class="tabs" aria-label="PCB 보기"><button type="button" aria-pressed="true" data-view="iso">입체</button><button type="button" aria-pressed="false" data-view="top">앞면</button><button type="button" aria-pressed="false" data-view="bottom">뒷면</button></div></div>
<div class="canvas"><img data-view="iso" src="/home/minpeter/github.com/minpeter/maru60/rendering/pcb-mcu-near-usb-20261113/pcb-iso-crop.png" alt="최종 PCB 입체 렌더링"><img hidden data-view="top" src="/home/minpeter/github.com/minpeter/maru60/rendering/pcb-mcu-near-usb-20261113/pcb-top-crop.png" alt="최종 PCB 앞면"><img hidden data-view="bottom" src="/home/minpeter/github.com/minpeter/maru60/rendering/pcb-mcu-near-usb-20261113/pcb-bottom-crop.png" alt="최종 PCB 뒷면"></div>
<p class="caption">285 × 94.6 mm · 4층 · 1.6 mm 두께. 실제 KiCad 원본에서 렌더링했습니다. 부품 몸체·스위치·스태빌라이저는 표시하지 않으며, 색상과 조명은 시각화용입니다.</p>
<div class="details"><figure><div class="detail-image"><img src="/home/minpeter/github.com/minpeter/maru60/rendering/pcb-mcu-near-usb-20261113/usb-mcu-detail.png" alt="USB와 MCU 주변 PCB 뒷면 확대"></div><figcaption><strong>USB·MCU 주변 · 뒷면</strong>USB 근처에 배치한 RP2350과 주변 부품의 패드입니다.</figcaption></figure><figure><div class="detail-image"><img src="/home/minpeter/github.com/minpeter/maru60/rendering/pcb-mcu-near-usb-20261113/backspace-detail.png" alt="2U 및 분할 Backspace PCB 앞면 확대"></div><figcaption><strong>Backspace 주변 · 앞면</strong>중앙 2U와 분할 배열의 스위치 홀·패드가 함께 있습니다. 선택한 배열만 조립합니다.</figcaption></figure></div>
<script>document.querySelectorAll('.tabs button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));document.querySelectorAll('.canvas img').forEach(img=>img.hidden=img.dataset.view!==button.dataset.view)}));</script>
</body></html>
