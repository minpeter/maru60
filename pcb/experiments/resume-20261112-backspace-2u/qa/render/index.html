<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 8px}.label{font-size:15px;font-weight:650}.tabs{display:flex;gap:4px}button{border:1px solid var(--border);background:var(--secondary);color:var(--foreground);border-radius:7px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}
.frame{background:#e9e7e2;border-radius:var(--radius);padding:16px;aspect-ratio:2.65;display:flex;align-items:center;justify-content:center;overflow:hidden}.frame img{width:100%;height:100%;object-fit:contain}.frame img[hidden]{display:none}.note{font-size:12px;color:var(--muted-foreground);line-height:1.6;margin:8px 0 16px}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.detail{margin:0}.detail img{width:100%;height:130px;object-fit:contain;background:#e9e7e2;border-radius:var(--radius);padding:10px}.detail figcaption{font-size:12px;color:var(--muted-foreground);margin-top:5px}@media(max-width:430px){.details{grid-template-columns:1fr}.bar{flex-wrap:wrap}.frame{aspect-ratio:2.2}}
#plate,.detail:last-child img{background:#252b32}</style></head><body>
<div class="bar"><span class="label">PCB · 현재 PR 버전</span><div class="tabs" data-group="pcb"><button aria-pressed="true" data-view="iso">입체</button><button aria-pressed="false" data-view="top">앞면</button><button aria-pressed="false" data-view="bottom">뒷면</button></div></div>
<div class="frame" id="pcb"><img data-view="iso" src="./pcb-iso-crop.png" alt="현재 PCB 입체 렌더링"><img hidden data-view="top" src="./pcb-top-hd-crop.png" alt="PCB 앞면"><img hidden data-view="bottom" src="./pcb-bottom-hd-crop.png" alt="PCB 뒷면"></div>
<div class="bar"><span class="label">보강판 · 7U 보강판용 + 2U 백스페이스</span><div class="tabs" data-group="plate"><button aria-pressed="true" data-view="iso">입체</button><button aria-pressed="false" data-view="top">윗면</button></div></div>
<div class="frame" id="plate"><img data-view="iso" src="./plate-iso-crop.png" alt="보강판 입체 렌더링"><img hidden data-view="top" src="./plate-top-crop.png" alt="보강판 윗면"></div>
<div class="details"><figure class="detail"><img src="./backspace-detail.png" alt="백스페이스 PCB 확대"><figcaption>2U / 분할 백스페이스 PCB 홀·패드</figcaption></figure><figure class="detail"><img src="./spacebar-detail.png" alt="7U 보강판 고정부 확대"><figcaption>7U 스페이스바 · 보강판용 고정부</figcaption></figure></div>
<p class="note">실제 CAD 형상 기준. PCB는 부품 3D 모델이 없는 상태이며, 보강판은 1.5 mm 두께로 표현했습니다. 색상·재질은 시각화용입니다.</p>
<script>document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{const t=b.parentElement; t.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));document.getElementById(t.dataset.group).querySelectorAll('img').forEach(x=>x.hidden=x.dataset.view!==b.dataset.view)})</script></body></html>
