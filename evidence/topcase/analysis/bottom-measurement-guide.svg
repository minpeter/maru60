<text x="30.0" y="777.1" fill="var(--muted, #777)" text-anchor="start">재는 법: 높이·깊이는 하판을 책상에 놓고 캘리퍼스 꼬리(깊이 바)로. 숫자마다 캘리퍼스 화면이 보이게 사진 한 장이면 충분해.</text>
