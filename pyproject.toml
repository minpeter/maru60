[project]
name = "maru60"
version = "0.9.0"
description = "Maru60, an HHKB housing for the Rule 60 V3's internals with a built-in honeycomb wrist rest, and the standalone v9 wrist rest"
requires-python = ">=3.11,<3.15"
license = "CC-BY-4.0"
dependencies = [
  "numpy",
  "scipy",
  "trimesh",
  "manifold3d",
  "networkx",
  "lxml",
  "shapely",
  "rtree",
]
